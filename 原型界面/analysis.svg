<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect width="960" height="600" fill="#f7f8fa"/>
  <rect x="0" y="0" width="960" height="48" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="20" y="31" font-size="17" font-weight="bold" fill="#18344d">AI 论文宠物 · 数据分析（Agent 写代码）</text>

  <!-- 左：任务 -->
  <rect x="0" y="48" width="280" height="512" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="16" y="76" font-size="13" font-weight="bold" fill="#18344d">任务</text>
  <rect x="16" y="90" width="248" height="60" rx="6" fill="#f2f5f9" stroke="#d7dde5"/>
  <text x="28" y="112" font-size="12" fill="#333">对 income 与 score 做相关</text>
  <text x="28" y="132" font-size="12" fill="#333">分析并画散点图</text>
  <text x="16" y="180" font-size="12" fill="#555">数据：survey.csv（12 列）</text>
  <text x="16" y="210" font-size="11" fill="#8a93a0">模型自主编写 Python 代码</text>
  <text x="16" y="230" font-size="11" fill="#8a93a0">→ 本地隔离沙箱执行</text>
  <text x="16" y="250" font-size="11" fill="#8a93a0">→ 返回真实结果</text>

  <!-- 中：代码 -->
  <rect x="280" y="48" width="380" height="512" fill="#1e2530" />
  <text x="296" y="76" font-size="12" fill="#9fd0ff"># Agent 生成的代码（可复核）</text>
  <text x="296" y="100" font-size="11" fill="#d6e0ea">import pandas as pd</text>
  <text x="296" y="120" font-size="11" fill="#d6e0ea">import matplotlib.pyplot as plt</text>
  <text x="296" y="148" font-size="11" fill="#d6e0ea">df = pd.read_csv("survey.csv")</text>
  <text x="296" y="168" font-size="11" fill="#d6e0ea">r = df["income"].corr(df["score"])</text>
  <text x="296" y="188" font-size="11" fill="#d6e0ea">plt.scatter(df["income"],</text>
  <text x="316" y="206" font-size="11" fill="#d6e0ea">df["score"], alpha=0.6)</text>
  <text x="296" y="240" font-size="11" fill="#7ee0a0"># 沙箱执行结果</text>
  <text x="296" y="260" font-size="11" fill="#ffd479">Pearson r = 0.42 (p&lt;0.01)</text>
  <text x="296" y="280" font-size="11" fill="#ffd479">n = 512</text>

  <!-- 右：图表 + 结果 -->
  <rect x="660" y="48" width="300" height="512" fill="#ffffff" stroke="#e3e6eb"/>
  <text x="676" y="76" font-size="13" font-weight="bold" fill="#18344d">输出（真实）</text>
  <rect x="676" y="90" width="248" height="170" rx="6" fill="#ffffff" stroke="#d7dde5"/>
  <circle cx="720" cy="150" r="3" fill="#4e79a7"/>
  <circle cx="760" cy="180" r="3" fill="#4e79a7"/>
  <circle cx="800" cy="140" r="3" fill="#4e79a7"/>
  <circle cx="840" cy="200" r="3" fill="#4e79a7"/>
  <circle cx="780" cy="220" r="3" fill="#4e79a7"/>
  <circle cx="730" cy="210" r="3" fill="#4e79a7"/>
  <line x1="690" y1="230" x2="900" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="690" y="285" font-size="10" fill="#8a93a0">散点图：income × score（占位）</text>
  <rect x="676" y="276" width="248" height="60" rx="6" fill="#f2f5f9" stroke="#d7dde5"/>
  <text x="688" y="298" font-size="11" fill="#333">r = 0.42 · n = 512</text>
  <text x="688" y="318" font-size="11" fill="#555">中等正相关</text>
  <text x="676" y="360" font-size="11" fill="#8a93a0">写作 Skill 据真实结果</text>
  <text x="676" y="380" font-size="11" fill="#8a93a0">组织分析段落，不补造</text>

  <text x="20" y="588" font-size="10" fill="#aab2bd">线框图（占位）：以线上安装包真实界面为准，后续替换截图</text>
</svg>
